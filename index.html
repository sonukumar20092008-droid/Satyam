<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>satyam STORE · Premium Gaming Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ROOT VARIABLES */
        :root {
            --bg-color: #05080f;
            --card-bg: rgba(12, 18, 38, 0.85);
            --card-border: rgba(0, 255, 102, 0.12);
            --neon-green: #00ff66;
            --neon-green-dim: rgba(0, 255, 102, 0.25);
            --neon-purple: #8b5cf6;
            --neon-purple-dim: rgba(139, 92, 246, 0.25);
            --neon-blue: #00d4ff;
            --neon-blue-dim: rgba(0, 212, 255, 0.2);
            --text-main: #ffffff;
            --text-muted: #8892a8;
            --text-secondary: #6a7a96;
            --error: #ff2a5f;
            --success: #00ff66;
            --warning: #ffb800;
            --gold: #ffd700;
            --gradient-green: linear-gradient(135deg, #00ff66, #00d4ff);
            --gradient-purple: linear-gradient(135deg, #8b5cf6, #00d4ff);
            --gradient-red: linear-gradient(135deg, #ff2a5f, #8b5cf6);
            --radius: 18px;
            --radius-sm: 10px;
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --navbar-height: 72px;
            --sidebar-width: 270px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        html { scroll-behavior: smooth; }
        body {
            background: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            transition: background 0.6s ease;
        }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        img { max-width: 100%; display: block; }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        ::-webkit-scrollbar-thumb {
            background: var(--neon-green-dim);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }

        .hidden { display: none !important; }
        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            transition: var(--transition);
        }
        .glass:hover {
            border-color: var(--neon-green);
            box-shadow: 0 0 50px var(--neon-green-dim), inset 0 0 30px var(--neon-green-dim);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 30px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            background: var(--gradient-green);
            color: #000;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0);
            border-radius: 50%;
            transition: transform 0.6s;
        }
        .btn:active::after { transform: scale(4); }
        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 50px rgba(0, 255, 102, 0.3);
        }
        .btn-sm { padding: 6px 16px; font-size: 12px; border-radius: 30px; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
        }
        .btn-outline:hover {
            border-color: var(--neon-green);
            color: var(--neon-green);
            background: rgba(0, 255, 102, 0.05);
            box-shadow: 0 0 30px var(--neon-green-dim);
            transform: translateY(-2px);
        }
        .btn-purple {
            background: var(--gradient-purple);
            color: #fff;
        }
        .btn-danger {
            background: var(--gradient-red);
            color: #fff;
        }

        /* Toast */
        #toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            width: 90%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            padding: 14px 20px;
            border-radius: 12px;
            color: #fff;
            font-weight: 500;
            font-size: 14px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--neon-green);
            animation: slideUp 0.4s forwards;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        .toast.error { border-left-color: var(--error); }
        .toast.success { border-left-color: var(--success); }
        .toast.warning { border-left-color: var(--warning); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Loading */
        .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--neon-green);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 15, 0.92);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            flex-direction: column;
            gap: 20px;
            animation: splashFade 0.8s ease;
        }
        @keyframes splashFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .loading-overlay .spinner {
            width: 56px;
            height: 56px;
            border-width: 4px;
            animation: spin 1s linear infinite;
        }
        .loading-overlay p {
            color: var(--text-muted);
            font-size: 14px;
            letter-spacing: 2px;
            animation: pulseText 1.5s ease-in-out infinite;
        }
        @keyframes pulseText {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .loading-overlay .logo-text {
            font-size: 32px;
            font-weight: 900;
            animation: logoFloat 2s ease-in-out infinite;
        }
        .loading-overlay .logo-text span { color: var(--neon-green); }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Auth Screen */
        #auth-screen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 1;
            animation: fadeInBg 0.8s ease;
        }
        @keyframes fadeInBg {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .auth-card {
            width: 100%;
            max-width: 460px;
            padding: 40px 32px;
            text-align: center;
            background: rgba(10, 14, 28, 0.92);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 255, 102, 0.12);
            border-radius: 24px;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease;
            box-shadow: 0 0 60px rgba(0, 255, 102, 0.04);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .auth-card .store-logo {
            font-size: 34px;
            font-weight: 900;
            margin-bottom: 4px;
        }
        .auth-card .store-logo span { color: var(--neon-green); }
        .auth-card .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 20px;
        }
        .auth-card .role-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--card-border);
        }
        .auth-card .role-selector .role-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .auth-card .role-selector .role-btn.active {
            background: var(--gradient-green);
            color: #000;
            box-shadow: 0 0 30px var(--neon-green-dim);
        }
        .auth-card .role-selector .role-btn.admin-role.active {
            background: var(--gradient-purple);
            color: #fff;
            box-shadow: 0 0 30px var(--neon-purple-dim);
        }
        .auth-card .input-group {
            margin-bottom: 14px;
            text-align: left;
            position: relative;
        }
        .auth-card .input-group label {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }
        .auth-card .input-group input {
            width: 100%;
            padding: 0 18px;
            height: 50px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: var(--transition);
        }
        .auth-card .input-group input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 30px var(--neon-green-dim);
            transform: scale(1.01);
        }
        .auth-card .input-group .toggle-pass {
            position: absolute;
            right: 14px;
            bottom: 14px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
        }
        .auth-card .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 18px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .auth-card .form-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .auth-card .form-options input[type="checkbox"] {
            accent-color: var(--neon-green);
        }
        .auth-card .form-options span {
            color: var(--neon-green);
            cursor: pointer;
            font-weight: 500;
        }
        .auth-card .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            margin-top: 4px;
        }

        /* Main App */
        #main-app {
            display: none;
            min-height: 100vh;
            position: relative;
            z-index: 1;
            animation: fadeInApp 0.6s ease;
        }
        @keyframes fadeInApp {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--navbar-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            background: rgba(5, 8, 15, 0.88);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .menu-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .menu-btn:hover {
            background: rgba(0, 255, 102, 0.08);
            color: var(--neon-green);
        }
        .nav-logo {
            font-size: 20px;
            font-weight: 900;
            white-space: nowrap;
        }
        .nav-logo span { color: var(--neon-green); }
        .nav-logo .badge-role {
            font-size: 9px;
            background: var(--neon-purple);
            color: #fff;
            padding: 2px 10px;
            border-radius: 30px;
            margin-left: 6px;
            font-weight: 600;
        }
        .nav-logo .badge-role.user-role {
            background: var(--neon-green);
            color: #000;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-icon {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: var(--transition);
        }
        .nav-icon:hover {
            background: rgba(0, 255, 102, 0.08);
            color: var(--neon-green);
        }
        .nav-icon .badge {
            position: absolute;
            top: 4px;
            right: 4px;
            background: var(--error);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .balance-badge {
            background: rgba(0, 255, 102, 0.08);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .add-funds-btn {
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            background: var(--gradient-green);
            border: none;
            color: #000;
            cursor: pointer;
            transition: var(--transition);
        }
        .switch-panel-btn {
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            background: var(--gradient-purple);
            border: none;
            color: #fff;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .switch-panel-btn.user-mode {
            background: var(--gradient-green);
            color: #000;
        }

        /* Sidebar */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            top: var(--navbar-height);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        .sidebar-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .sidebar {
            position: fixed;
            top: var(--navbar-height);
            left: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: rgba(5, 8, 15, 0.96);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--card-border);
            padding: 16px 0;
            overflow-y: auto;
            z-index: 999;
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-header {
            padding: 8px 24px 16px;
            border-bottom: 1px solid var(--card-border);
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .sidebar-item {
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-muted);
            font-size: 14px;
            border-left: 3px solid transparent;
        }
        .sidebar-item:hover {
            color: var(--neon-green);
            border-left-color: var(--neon-green);
            background: rgba(0, 255, 102, 0.05);
        }
        .sidebar-item i { font-size: 16px; }

        /* Content Area */
        .main-content {
            margin-top: var(--navbar-height);
            margin-left: 0;
            padding: 20px;
            transition: margin-left 0.4s;
        }
        .main-content.sidebar-open {
            margin-left: var(--sidebar-width);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 20px;
            transition: var(--transition);
            cursor: pointer;
        }
        .product-card:hover {
            border-color: var(--neon-green);
            box-shadow: 0 0 50px var(--neon-green-dim);
        }
        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }
        .product-title {
            font-size: 16px;
            font-weight: 600;
        }
        .product-price {
            font-size: 14px;
            color: var(--neon-green);
            font-weight: 700;
        }
        .product-description {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .product-footer {
            display: flex;
            gap: 10px;
        }
        .product-footer .btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="logo-text">saty<span>am</span></div>
        <div class="spinner"></div>
        <p>LOADING...</p>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Auth Screen -->
    <div id="auth-screen">
        <div class="auth-card">
            <div class="store-logo">saty<span>am</span></div>
            <p class="subtitle">Premium Gaming Store</p>
            
            <div class="role-selector">
                <button class="role-btn user-role active" data-role="user">
                    <i class="fas fa-user"></i> User
                </button>
                <button class="role-btn admin-role" data-role="admin">
                    <i class="fas fa-crown"></i> Admin
                </button>
            </div>

            <div class="input-group">
                <label><i class="fas fa-user"></i> Username or Email</label>
                <input type="text" id="username" placeholder="Enter your username" />
            </div>

            <div class="input-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="Enter your password" />
                <i class="fas fa-eye toggle-pass" data-toggle="password"></i>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" id="remember" />
                    <span>Remember me</span>
                </label>
                <span class="forgot-password">Forgot Password?</span>
            </div>

            <button class="btn" id="loginBtn" onclick="handleLogin()">LOGIN</button>

            <div style="margin-top: 20px; text-align: center; font-size: 12px; color: var(--text-muted);">
                <p>Don't have an account? <span style="color: var(--neon-green); cursor: pointer;">Sign Up</span></p>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="main-app">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="nav-left">
                <button class="menu-btn" id="menuBtn" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="nav-logo">
                    saty<span>am</span>
                    <span class="badge-role" id="roleBadge">USER</span>
                </div>
            </div>
            <div class="nav-right">
                <button class="nav-icon" onclick="showToast('Notifications coming soon!', 'info')">
                    <i class="fas fa-bell"></i>
                    <span class="badge">3</span>
                </button>
                <div class="balance-badge">
                    <i class="fas fa-coins"></i>
                    <span id="balance">$0.00</span>
                </div>
                <button class="add-funds-btn" onclick="showToast('Add Funds feature coming soon!', 'info')">
                    <i class="fas fa-plus"></i> Add Funds
                </button>
                <button class="switch-panel-btn" id="switchBtn" onclick="switchRole()">
                    <i class="fas fa-exchange-alt"></i> Switch
                </button>
                <button class="nav-icon" onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </nav>

        <!-- Sidebar -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-gamepad"></i> MENU
            </div>
            <div class="sidebar-item" onclick="navigateTo('home')">
                <i class="fas fa-home"></i> Home
            </div>
            <div class="sidebar-item" onclick="navigateTo('store')">
                <i class="fas fa-store"></i> Store
            </div>
            <div class="sidebar-item" onclick="navigateTo('orders')">
                <i class="fas fa-shopping-cart"></i> My Orders
            </div>
            <div class="sidebar-item" onclick="navigateTo('wallet')">
                <i class="fas fa-wallet"></i> Wallet
            </div>
            <div class="sidebar-item" onclick="navigateTo('support')">
                <i class="fas fa-headset"></i> Support
            </div>
            <div class="sidebar-item" onclick="navigateTo('settings')">
                <i class="fas fa-cog"></i> Settings
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <h1 style="font-size: 28px; margin-bottom: 10px;">Welcome to Satyam Store! 🎮</h1>
            <p style="color: var(--text-muted); margin-bottom: 30px;">Best gaming products and services</p>

            <div class="products-grid" id="productsGrid">
                <!-- Products will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // Global Variables
        let currentUser = null;
        let currentRole = 'user';
        let sidebarOpen = false;

        // Initialize App
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loadingOverlay').style.display = 'none';
                checkAuth();
            }, 1500);
        });

        // Toggle Password Visibility
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('toggle-pass')) {
                const input = e.target.parentElement.querySelector('input');
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                e.target.classList.toggle('fa-eye');
                e.target.classList.toggle('fa-eye-slash');
            }
        });

        // Role Selection
        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentRole = this.getAttribute('data-role');
            });
        });

        // Handle Login
        function handleLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            if (!username || !password) {
                showToast('Please fill all fields!', 'error');
                return;
            }

            // Simulate login
            currentUser = {
                username: username,
                role: currentRole,
                balance: 100.50
            };

            localStorage.setItem('satyamUser', JSON.stringify(currentUser));
            showToast(`Welcome ${username}! 🎉`, 'success');
            
            setTimeout(() => {
                showMainApp();
            }, 800);
        }

        // Show Main App
        function showMainApp() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('roleBadge').textContent = currentUser.role.toUpperCase();
            document.getElementById('balance').textContent = '$' + currentUser.balance.toFixed(2);
            loadProducts();
        }

        // Load Products
        function loadProducts() {
            const products = [
                { id: 1, title: 'Gaming Mouse', price: 49.99, desc: 'High precision gaming mouse' },
                { id: 2, title: 'Keyboard RGB', price: 79.99, desc: 'Mechanical keyboard with RGB' },
                { id: 3, title: 'Headphones', price: 99.99, desc: 'Premium gaming headphones' },
                { id: 4, title: 'Monitor 144Hz', price: 299.99, desc: 'Ultra-fast gaming monitor' },
                { id: 5, title: 'Gaming Pad', price: 59.99, desc: 'Extended mouse pad' },
                { id: 6, title: 'USB Hub', price: 39.99, desc: 'Multi-port USB hub' }
            ];

            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-header">
                        <div class="product-title">${product.title}</div>
                    </div>
                    <div class="product-description">${product.desc}</div>
                    <div class="product-price">${product.price}</div>
                    <div class="product-footer">
                        <button class="btn btn-sm" onclick="showToast('Added to cart!', 'success')">
                            <i class="fas fa-shopping-cart"></i> Cart
                        </button>
                        <button class="btn btn-sm btn-outline" onclick="showToast('Added to wishlist!', 'success')">
                            <i class="fas fa-heart"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Toggle Sidebar
        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }

        function closeSidebar() {
            sidebarOpen = false;
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('show');
        }

        // Navigation
        function navigateTo(page) {
            showToast(`Navigating to ${page}...`, 'info');
            closeSidebar();
        }

        // Switch Role
        function switchRole() {
            currentRole = currentRole === 'user' ? 'admin' : 'user';
            document.getElementById('roleBadge').textContent = currentRole.toUpperCase();
            document.getElementById('switchBtn').classList.toggle('user-mode');
            showToast(`Switched to ${currentRole} mode!`, 'success');
        }

        // Logout
        function handleLogout() {
            localStorage.removeItem('satyamUser');
            currentUser = null;
            document.getElementById('main-app').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            showToast('Logged out successfully!', 'success');
        }

        // Check Authentication
        function checkAuth() {
            const saved = localStorage.getItem('satyamUser');
            if (saved) {
                currentUser = JSON.parse(saved);
                showMainApp();
            }
        }

        // Show Toast Notification
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle',
                warning: 'fa-exclamation-triangle'
            };
            
            toast.innerHTML = `<i class="fas ${icons[type]}"></i><span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Forgot Password
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('forgot-password')) {
                showToast('Password reset link sent to your email!', 'info');
            }
        });
    </script>
</body>
</html>
